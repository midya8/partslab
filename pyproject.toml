[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "partslab"
version = "0.2.0"
description = "Manual NumPy nonnegative factorization with held-out NNLS and visible nonidentifiability"
requires-python = ">=3.10"
dependencies = ["numpy==2.2.6"]
license = "MIT"
[tool.setuptools.package-data]
partslab = ["data/*", "artifacts/*"]
[tool.setuptools.packages.find]
include = ["partslab*"]
namespaces = false
[project.scripts]
partslab = "partslab.__main__:main"
